<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Wants to Be a Millionaire? — England & USA</title>
<style>
  :root{
    --navy-deep:#050b24;
    --navy:#0d1b4b;
    --navy-light:#1b2f78;
    --gold:#e8c15c;
    --gold-bright:#ffe08a;
    --white:#f4f6ff;
    --correct:#2f9e5b;
    --wrong:#c0392b;
    --dim:#9fb0e0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #1a2d78 0%, var(--navy-deep) 55%),
      var(--navy-deep);
    color:var(--white);
    font-family:Verdana, Geneva, Arial, sans-serif;
  }
  .stage{
    max-width:980px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:clamp(22px,4.5vw,38px);
    color:var(--gold-bright);
    letter-spacing:0.5px;
    margin:0 0 4px;
    text-shadow:0 0 18px rgba(232,193,92,0.35);
  }
  header p{
    margin:0;
    color:var(--dim);
    font-size:14px;
  }
  .layout{
    display:flex;
    gap:20px;
    align-items:flex-start;
  }
  .main-panel{
    flex:1;
    min-width:0;
  }
  .ladder-panel{
    width:190px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--navy-light), var(--navy));
    border:1px solid rgba(232,193,92,0.35);
    border-radius:10px;
    padding:10px;
  }
  .ladder-title{
    text-align:center;
    font-size:12px;
    color:var(--dim);
    margin-bottom:8px;
    letter-spacing:0.5px;
  }
  .ladder-row{
    display:flex;
    justify-content:space-between;
    padding:6px 8px;
    font-size:13px;
    border-radius:4px;
    color:var(--dim);
  }
  .ladder-row .num{opacity:0.7;}
  .ladder-row.safe{color:var(--gold-bright); font-weight:bold;}
  .ladder-row.current{
    background:var(--gold);
    color:var(--navy-deep);
    font-weight:bold;
  }
  .ladder-row.done{
    color:var(--white);
  }
  .progress-bar{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    margin-bottom:10px;
  }
  .card{
    background:linear-gradient(180deg, var(--navy-light), var(--navy));
    border:1px solid rgba(232,193,92,0.3);
    border-radius:12px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .question-text{
    font-size:clamp(17px,2.4vw,21px);
    line-height:1.5;
    text-align:center;
    margin:6px 0 20px;
    min-height:50px;
  }
  .answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media(max-width:560px){
    .answers{grid-template-columns:1fr;}
    .layout{flex-direction:column;}
    .ladder-panel{width:100%;order:2;}
  }
  .answer-btn{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    background:var(--navy-deep);
    border:1.5px solid var(--gold);
    color:var(--white);
    border-radius:24px;
    font-size:15px;
    text-align:left;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.2s ease;
    font-family:inherit;
  }
  .answer-btn:hover:not(:disabled){
    background:var(--navy-light);
    transform:translateY(-1px);
  }
  .answer-btn:disabled{
    cursor:default;
  }
  .answer-btn .letter{
    background:var(--gold);
    color:var(--navy-deep);
    font-weight:bold;
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    flex-shrink:0;
  }
  .answer-btn.eliminated{
    opacity:0.2;
    pointer-events:none;
  }
  .answer-btn.correct{
    background:var(--correct);
    border-color:var(--correct);
    color:white;
  }
  .answer-btn.wrong{
    background:var(--wrong);
    border-color:var(--wrong);
    color:white;
  }
  .lifelines{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:18px 0 4px;
  }
  .lifeline-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:var(--navy-deep);
    color:var(--gold-bright);
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.1;
  }
  .lifeline-btn:hover:not(:disabled){
    background:var(--navy-light);
  }
  .lifeline-btn:disabled{
    opacity:0.25;
    cursor:default;
    text-decoration:line-through;
  }
  .hint-box{
    margin-top:14px;
    background:rgba(232,193,92,0.1);
    border:1px dashed var(--gold);
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
    color:var(--gold-bright);
    text-align:center;
    min-height:20px;
  }
  .audience-chart{
    margin-top:14px;
    display:flex;
    justify-content:center;
    gap:16px;
  }
  .audience-bar-wrap{
    text-align:center;
    font-size:12px;
    color:var(--dim);
  }
  .audience-bar{
    width:30px;
    background:var(--gold);
    border-radius:3px 3px 0 0;
    margin:0 auto 4px;
  }
  .controls{
    text-align:center;
    margin-top:18px;
  }
  .next-btn, .restart-btn, .quit-btn{
    background:var(--gold);
    color:var(--navy-deep);
    border:none;
    padding:11px 26px;
    border-radius:22px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    margin:4px 6px;
  }
  .quit-btn{
    background:transparent;
    color:var(--dim);
    border:1px solid var(--dim);
  }
  .quit-btn:hover{color:var(--white); border-color:var(--white);}
  .feedback{
    text-align:center;
    font-size:16px;
    font-weight:bold;
    margin-top:14px;
    min-height:22px;
  }
  .feedback.good{color:#7be3a0;}
  .feedback.bad{color:#ff9d8a;}
  .end-screen{
    text-align:center;
  }
  .end-screen .amount{
    font-size:clamp(30px,6vw,46px);
    color:var(--gold-bright);
    font-family:Georgia, serif;
    margin:12px 0;
    text-shadow:0 0 20px rgba(232,193,92,0.4);
  }
  .end-screen p.msg{
    font-size:15px;
    color:var(--dim);
    max-width:520px;
    margin:0 auto 18px;
  }
  .start-screen{
    text-align:center;
  }
  .start-screen p{
    color:var(--dim);
    font-size:15px;
    line-height:1.6;
    max-width:600px;
    margin:0 auto 18px;
  }
  .flags{
    font-size:34px;
    margin-bottom:6px;
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="flags">🇬🇧 🇺🇸</div>
    <h1>Who Wants to Be a Millionaire?</h1>
    <p>England & USA Edition — Level A2</p>
  </header>

  <div class="layout">
    <div class="main-panel">
      <div id="game-area" class="card"></div>
    </div>
    <div class="ladder-panel" id="ladder-panel"></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: "What is the capital city of England?",
    options: ["London", "Manchester", "Liverpool", "Bristol"],
    correct: 0,
    hint: "It has a famous clock called Big Ben."
  },
  {
    q: "What is the capital city of the USA?",
    options: ["New York", "Washington, D.C.", "Los Angeles", "Chicago"],
    correct: 1,
    hint: "It is not the biggest US city, but it is the political center."
  },
  {
    q: "What color is a traditional British post box?",
    options: ["Blue", "Green", "Red", "Yellow"],
    correct: 2,
    hint: "It is the same color as a British telephone box."
  },
  {
    q: "In Britain, what do people call fried potato sticks that they eat with fish?",
    options: ["Crisps", "Chips", "Fries", "Wedges"],
    correct: 1,
    hint: "The famous British meal is 'fish and ___'."
  },
  {
    q: "Which river flows through London?",
    options: ["The Severn", "The Avon", "The Thames", "The Mersey"],
    correct: 2,
    hint: "This river passes next to the Houses of Parliament."
  },
  {
    q: "What is a nickname for the flag of the United States?",
    options: ["The Stars and Stripes", "The Union Jack", "The Tricolour", "The Maple Leaf"],
    correct: 0,
    hint: "Think about the stars and the lines on the flag."
  },
  {
    q: "Which bird is a national symbol of the United States?",
    options: ["The owl", "The robin", "The bald eagle", "The peacock"],
    correct: 2,
    hint: "You can see this bird on the Great Seal of the USA."
  },
  {
    q: "What is the name of the famous clock tower in London?",
    options: ["Big Ben", "The London Eye", "Tower Bridge", "The Shard"],
    correct: 0,
    hint: "This is not a bridge and not a wheel — it makes a sound every hour."
  },
  {
    q: "In November, Americans eat turkey and give thanks. What is this holiday called?",
    options: ["Halloween", "Thanksgiving", "Easter", "Labor Day"],
    correct: 1,
    hint: "The name of the holiday includes the word 'thanks'."
  },
  {
    q: "What is the official currency of the United Kingdom?",
    options: ["The euro", "The dollar", "The pound", "The yen"],
    correct: 2,
    hint: "British money is called sterling."
  },
  {
    q: "Which famous statue stands in New York Harbor?",
    options: ["The Statue of Liberty", "Christ the Redeemer", "The Statue of Unity", "The Little Mermaid"],
    correct: 0,
    hint: "It was a gift from France and it holds a torch."
  },
  {
    q: "In the United Kingdom, which side of the road do cars drive on?",
    options: ["The right side", "The left side", "The middle", "It changes by city"],
    correct: 1,
    hint: "This is different from most of Europe and the USA."
  },
  {
    q: "What is the name of American Independence Day?",
    options: ["New Year's Day", "Labor Day", "The Fourth of July", "May Day"],
    correct: 2,
    hint: "The date is in the name of the holiday."
  },
  {
    q: "Which US city is famous for the film industry and the Hollywood sign?",
    options: ["Chicago", "Miami", "Los Angeles", "New York"],
    correct: 2,
    hint: "This city is in California, on the west coast."
  },
  {
    q: "What is the official home and office of the US President called?",
    options: ["Capitol Hill", "The Red House", "The Blue House", "The White House"],
    correct: 3,
    hint: "The color of the building is in its name."
  }
];

const MONEY = [
  "$100","$200","$300","$500","$1,000",
  "$2,000","$4,000","$8,000","$16,000","$32,000",
  "$64,000","$125,000","$250,000","$500,000","$1,000,000"
];
const SAFE_LEVELS = [4, 9]; // index of question after which money is "safe" (0-based: after Q5 and Q10)

let state = {};

function resetState(){
  state = {
    current: 0,
    selected: null,
    answered: false,
    lifelines: { fifty: true, audience: true, hint: true },
    eliminated: [],
    finished: false,
    won: false,
    lastEarned: 0
  };
}

function moneyForIndex(i){
  return MONEY[i];
}
function safeMoney(currentIndex){
  // highest safe level reached BEFORE currentIndex
  let safeIdx = -1;
  SAFE_LEVELS.forEach(lv => { if (currentIndex > lv) safeIdx = lv; });
  return safeIdx === -1 ? "$0" : MONEY[safeIdx];
}

function renderLadder(){
  const panel = document.getElementById('ladder-panel');
  let html = '<div class="ladder-title">MONEY LADDER</div>';
  for (let i = MONEY.length - 1; i >= 0; i--){
    let cls = '';
    if (i === state.current && !state.finished) cls = 'current';
    else if (i < state.current || state.finished) cls = 'done';
    if (SAFE_LEVELS.includes(i)) cls += ' safe';
    html += `<div class="ladder-row ${cls}"><span class="num">${i+1}</span><span>${MONEY[i]}</span></div>`;
  }
  panel.innerHTML = html;
}

function renderStart(){
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="start-screen">
      <h2 style="color:var(--gold-bright); font-family:Georgia, serif;">Welcome!</h2>
      <p>Answer 15 easy questions about England and the USA. Choose one correct answer for each question. If you make a mistake, the game ends — but you keep money from the last "safe" level. You have three lifelines: 50:50, Ask the Audience, and Phone a Friend.</p>
      <button class="next-btn" onclick="startGame()">Start the Game</button>
    </div>
  `;
  document.getElementById('ladder-panel').innerHTML = '';
}

function startGame(){
  resetState();
  renderLadder();
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[state.current];
  const area = document.getElementById('game-area');
  const letters = ['A','B','C','D'];

  let answersHtml = q.options.map((opt, idx) => {
    const eliminated = state.eliminated.includes(idx) ? 'eliminated' : '';
    return `<button class="answer-btn ${eliminated}" id="ans-${idx}" onclick="selectAnswer(${idx})" ${state.answered ? 'disabled' : ''}>
      <span class="letter">${letters[idx]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  area.innerHTML = `
    <div class="progress-bar">Question ${state.current + 1} of ${QUESTIONS.length} — Playing for ${moneyForIndex(state.current)}</div>
    <div class="question-text">${q.q}</div>
    <div class="answers">${answersHtml}</div>
    <div class="lifelines">
      <button class="lifeline-btn" id="ll-fifty" onclick="useFifty()" ${!state.lifelines.fifty || state.answered ? 'disabled' : ''}>50:50</button>
      <button class="lifeline-btn" id="ll-audience" onclick="useAudience()" ${!state.lifelines.audience || state.answered ? 'disabled' : ''}>Audience</button>
      <button class="lifeline-btn" id="ll-hint" onclick="useHint()" ${!state.lifelines.hint || state.answered ? 'disabled' : ''}>Friend</button>
    </div>
    <div id="extra-area"></div>
    <div class="feedback" id="feedback"></div>
    <div class="controls" id="controls"></div>
  `;
  renderLadder();
}

function selectAnswer(idx){
  if (state.answered) return;
  state.answered = true;
  state.selected = idx;
  const q = QUESTIONS[state.current];

  q.options.forEach((opt, i) => {
    const btn = document.getElementById('ans-' + i);
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedback');
  const controls = document.getElementById('controls');

  if (idx === q.correct){
    state.lastEarned = state.current;
    feedback.textContent = "Correct! Well done.";
    feedback.className = "feedback good";
    if (state.current === QUESTIONS.length - 1){
      state.finished = true;
      state.won = true;
      controls.innerHTML = `<button class="next-btn" onclick="renderEnd()">See Result</button>`;
    } else {
      controls.innerHTML = `<button class="next-btn" onclick="nextQuestion()">Next Question →</button>`;
    }
  } else {
    feedback.textContent = "Sorry, that's not correct. The right answer is " + ['A','B','C','D'][q.correct] + ": " + q.options[q.correct] + ".";
    feedback.className = "feedback bad";
    state.finished = true;
    state.won = false;
    controls.innerHTML = `<button class="next-btn" onclick="renderEnd()">See Result</button>`;
  }
}

function nextQuestion(){
  state.current++;
  state.selected = null;
  state.answered = false;
  state.eliminated = [];
  renderQuestion();
}

function useFifty(){
  if (!state.lifelines.fifty || state.answered) return;
  state.lifelines.fifty = false;
  const q = QUESTIONS[state.current];
  const wrongIndexes = [0,1,2,3].filter(i => i !== q.correct);
  // shuffle and remove two wrong answers
  for (let i = wrongIndexes.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [wrongIndexes[i], wrongIndexes[j]] = [wrongIndexes[j], wrongIndexes[i]];
  }
  state.eliminated = wrongIndexes.slice(0, 2);
  document.getElementById('ll-fifty').disabled = true;
  state.eliminated.forEach(i => {
    const btn = document.getElementById('ans-' + i);
    if (btn) btn.classList.add('eliminated');
  });
}

function useHint(){
  if (!state.lifelines.hint || state.answered) return;
  state.lifelines.hint = false;
  document.getElementById('ll-hint').disabled = true;
  const q = QUESTIONS[state.current];
  document.getElementById('extra-area').innerHTML =
    `<div class="hint-box">💬 Your friend says: "${q.hint}"</div>`;
}

function useAudience(){
  if (!state.lifelines.audience || state.answered) return;
  state.lifelines.audience = false;
  document.getElementById('ll-audience').disabled = true;
  const q = QUESTIONS[state.current];
  const activeIndexes = [0,1,2,3].filter(i => !state.eliminated.includes(i));

  // Generate weighted random percentages, favoring the correct answer
  let raw = activeIndexes.map(i => i === q.correct ? (40 + Math.random()*35) : (Math.random()*30));
  const total = raw.reduce((a,b) => a+b, 0);
  let percents = raw.map(v => Math.round((v/total)*100));
  // fix rounding so it sums to 100
  let diff = 100 - percents.reduce((a,b)=>a+b,0);
  percents[0] += diff;

  const letters = ['A','B','C','D'];
  let barsHtml = activeIndexes.map((idx, k) => {
    const pct = percents[k];
    return `<div class="audience-bar-wrap">
      <div>${pct}%</div>
      <div class="audience-bar" style="height:${Math.max(pct,4)}px;"></div>
      <div>${letters[idx]}</div>
    </div>`;
  }).join('');

  document.getElementById('extra-area').innerHTML =
    `<div class="hint-box">📊 Audience results:</div>
     <div class="audience-chart">${barsHtml}</div>`;
}

function renderEnd(){
  const area = document.getElementById('game-area');
  let amount, message;
  if (state.won){
    amount = "$1,000,000";
    message = "Amazing! You answered every question correctly. You are a Millionaire of English knowledge about England and the USA!";
  } else {
    amount = safeMoney(state.current);
    message = `You answered ${state.current} question${state.current === 1 ? '' : 's'} correctly. You leave the game with ${amount}. Play again to try for the top prize!`;
  }
  area.innerHTML = `
    <div class="end-screen">
      <h2 style="color:var(--gold-bright); font-family:Georgia, serif; margin-bottom:0;">${state.won ? "🏆 Congratulations!" : "Game Over"}</h2>
      <div class="amount">${amount}</div>
      <p class="msg">${message}</p>
      <button class="restart-btn" onclick="renderStart()">Play Again</button>
    </div>
  `;
  renderLadder();
}

renderStart();
</script>
</body>
</html>
